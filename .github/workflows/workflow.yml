name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # ⭐ TASK 2: LINTING STEP
    - name: Run Linter
      run: |
        pip install pylint
        pylint **/*.py || true

    # ⭐ TASK 3: TEST STEP
    - name: Run Tests
      run: |
        pip install pytest
        pytest -v || true
